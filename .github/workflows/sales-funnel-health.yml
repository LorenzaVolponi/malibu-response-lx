name: Sales Funnel Health

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read

concurrency:
  group: malibu-sales-funnel-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  funnel:
    name: Verify WhatsApp lead attribution contract
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      SITE_URL: https://malibu-response-lx.vercel.app

    steps:
      - name: Checkout PR source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: github.event_name == 'pull_request'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build and start PR source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/malibu-sales-health-server.log 2>&1 &

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo 'SITE_URL=http://127.0.0.1:3000' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done

          cat /tmp/malibu-sales-health-server.log || true
          exit 1

      - name: Verify attributed share URLs and clean canonical
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$SITE_URL/" -o /tmp/malibu-share-home.html

          node <<'NODE'
          const fs = require('node:fs')
          const html = fs.readFileSync('/tmp/malibu-share-home.html', 'utf8')
          const canonical = 'https://malibu-response-lx.vercel.app'

          if (!html.includes('data-share-attribution="site_share"')) {
            throw new Error('Share attribution marker is missing from rendered home')
          }

          const required = [
            'utm_source=site_share',
            'utm_medium=referral',
            'utm_campaign=malibu_listing_share',
            'utm_content=native_share',
            'utm_content=whatsapp_share',
          ]
          for (const marker of required) {
            if (!html.includes(marker)) throw new Error(`Rendered share URLs are missing ${marker}`)
          }

          const canonicalTag = (html.match(/<link\b[^>]*\brel=["']canonical["'][^>]*>/i) ||
            html.match(/<link\b[^>]*\bhref=["'][^"']+["'][^>]*\brel=["']canonical["'][^>]*>/i))?.[0] || ''
          if (!canonicalTag) throw new Error('Canonical link was not found on home')

          const href = canonicalTag.match(/\bhref=["']([^"']+)["']/i)?.[1] || ''
          if (href !== canonical) throw new Error(`Canonical must stay clean: ${href}`)
          if (/utm_/i.test(canonicalTag)) throw new Error('Tracking parameters leaked into canonical metadata')
          NODE

      - name: Verify buyer-clean lead redirect
        shell: bash
        run: |
          set -euo pipefail

          TEST_URL="$SITE_URL/api/whatsapp?intent=offer&channel_group=organic_search&source_group=google&utm_source=google&utm_medium=organic&utm_campaign=sale%7Cline%0Abreak&landing_path=%2F&gclid=SENSITIVE_TEST_ID"
          status="$(curl -sS -D /tmp/whatsapp-headers -o /dev/null -w '%{http_code}' "$TEST_URL")"

          if [ "$status" != "302" ]; then
            echo "Expected HTTP 302 from WhatsApp lead redirect, got $status"
            cat /tmp/whatsapp-headers
            exit 1
          fi

          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/whatsapp-headers)"
          lead_ref="$(awk 'BEGIN{IGNORECASE=1} /^x-lead-reference:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/whatsapp-headers)"
          lead_intent="$(awk 'BEGIN{IGNORECASE=1} /^x-lead-intent:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/whatsapp-headers)"
          cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/whatsapp-headers)"
          robots="$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/whatsapp-headers)"

          LOCATION="$location" LEAD_REF="$lead_ref" LEAD_INTENT="$lead_intent" node <<'NODE'
          const location = process.env.LOCATION || ''
          const leadRef = process.env.LEAD_REF || ''
          const leadIntent = process.env.LEAD_INTENT || ''
          if (!/^[A-F0-9]{10}$/.test(leadRef)) throw new Error(`Invalid lead reference: ${leadRef}`)
          if (leadIntent !== 'offer') throw new Error(`Unexpected lead intent header: ${leadIntent}`)

          const destination = new URL(location)
          if (destination.hostname !== 'wa.me') throw new Error(`Unexpected redirect host: ${destination.hostname}`)
          const text = destination.searchParams.get('text') || ''

          if (!text.includes(`Referência do anúncio: ${leadRef}`)) {
            throw new Error('Buyer message is missing the correlatable listing reference')
          }

          const forbidden = [
            'Contexto do lead:',
            'lead_ref:',
            'intenção:',
            'channel_group',
            'source_group',
            'utm_source',
            'utm_medium',
            'utm_campaign',
            'landing_path',
            'gclid',
            'SENSITIVE_TEST_ID',
            'sale|line',
          ]
          for (const value of forbidden) {
            if (text.includes(value)) throw new Error(`Tracking detail leaked into buyer message: ${value}`)
          }
          NODE

          printf '%s' "$cache_control" | grep -F 'no-store' >/dev/null
          printf '%s' "$robots" | grep -F 'noindex' >/dev/null

      - name: Verify server-side attribution ledger
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          ledger_line="$(grep '\[whatsapp-lead\]' /tmp/malibu-sales-health-server.log | tail -n 1)"
          if [ -z "$ledger_line" ]; then
            echo 'No whatsapp lead ledger event was written by the local PR server.'
            cat /tmp/malibu-sales-health-server.log
            exit 1
          fi

          if printf '%s' "$ledger_line" | grep -F 'SENSITIVE_TEST_ID' >/dev/null; then
            echo 'Raw paid click ID leaked into server-side ledger.'
            exit 1
          fi

          LEDGER_LINE="$ledger_line" node <<'NODE'
          const line = process.env.LEDGER_LINE || ''
          const jsonStart = line.indexOf('{')
          if (jsonStart < 0) throw new Error('Ledger event JSON was not found')
          const event = JSON.parse(line.slice(jsonStart))

          const expected = {
            event: 'whatsapp_lead_redirect',
            intent: 'offer',
            channel_group: 'organic_search',
            source_group: 'google',
            utm_source: 'google',
            utm_medium: 'organic',
            utm_campaign: 'sale line break',
            landing_path: '/',
            has_paid_click_id: true,
          }
          for (const [key, value] of Object.entries(expected)) {
            if (event[key] !== value) throw new Error(`Ledger mismatch for ${key}: ${event[key]} !== ${value}`)
          }
          if (!/^[A-F0-9]{10}$/.test(event.lead_ref || '')) throw new Error('Ledger lead_ref is invalid')
          if (!event.occurred_at) throw new Error('Ledger timestamp is missing')
          NODE

      - name: Verify invalid intent fails safe
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sS -D - -o /dev/null "$SITE_URL/api/whatsapp?intent=not-a-real-intent")"
          intent="$(printf '%s' "$headers" | awk 'BEGIN{IGNORECASE=1} /^x-lead-intent:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}')"
          if [ "$intent" != "primary" ]; then
            echo "Invalid intent did not fall back to primary: $intent"
            exit 1
          fi

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Sales funnel health'
            echo "- Tested source: $SITE_URL"
            echo '- Verifies native and WhatsApp share URLs carry first-party share/referral attribution while canonical metadata remains clean.'
            echo '- Verifies WhatsApp redirect remains HTTP 302 and non-cacheable.'
            echo '- Verifies the buyer sees only the commercial message plus a short listing reference.'
            echo '- Verifies attribution/UTM/click IDs never leak into the buyer-facing WhatsApp text.'
            echo '- In PRs, verifies channel, source, campaign, landing and paid-click presence remain in the server-side ledger.'
            echo '- Verifies raw advertising click IDs are not persisted in the ledger.'
            echo '- Verifies untrusted attribution delimiters are sanitized server-side.'
            echo '- Verifies invalid intents fall back safely to primary.'
            echo '- No extra visual block is added by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
