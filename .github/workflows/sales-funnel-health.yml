name: Sales Funnel Health

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read

concurrency:
  group: malibu-sales-funnel-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  funnel:
    name: Verify WhatsApp lead attribution contract
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      SITE_URL: https://malibu-response-lx.vercel.app

    steps:
      - name: Checkout PR source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: github.event_name == 'pull_request'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build and start PR source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/malibu-sales-health-server.log 2>&1 &

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo 'SITE_URL=http://127.0.0.1:3000' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done

          cat /tmp/malibu-sales-health-server.log || true
          exit 1

      - name: Verify lead redirect contract
        shell: bash
        run: |
          set -euo pipefail

          TEST_URL="$SITE_URL/api/whatsapp?intent=offer&channel_group=organic_search&source_group=google&utm_source=google&utm_medium=organic&utm_campaign=sale%7Cline%0Abreak&landing_path=%2F&gclid=SENSITIVE_TEST_ID"
          status="$(curl -sS -D /tmp/whatsapp-headers -o /dev/null -w '%{http_code}' "$TEST_URL")"

          if [ "$status" != "302" ]; then
            echo "Expected HTTP 302 from WhatsApp lead redirect, got $status"
            cat /tmp/whatsapp-headers
            exit 1
          fi

          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/whatsapp-headers)"
          lead_ref="$(awk 'BEGIN{IGNORECASE=1} /^x-lead-reference:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/whatsapp-headers)"
          cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/whatsapp-headers)"
          robots="$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/whatsapp-headers)"

          LOCATION="$location" LEAD_REF="$lead_ref" node <<'NODE'
          const location = process.env.LOCATION || ''
          const leadRef = process.env.LEAD_REF || ''
          if (!/^[A-F0-9]{10}$/.test(leadRef)) throw new Error(`Invalid lead reference: ${leadRef}`)

          const destination = new URL(location)
          if (destination.hostname !== 'wa.me') throw new Error(`Unexpected redirect host: ${destination.hostname}`)
          const text = destination.searchParams.get('text') || ''

          const required = [
            'Contexto do lead:',
            `lead_ref: ${leadRef}`,
            'intenção: offer',
            'channel_group: organic_search',
            'source_group: google',
            'utm_source: google',
            'utm_medium: organic',
            'utm_campaign: sale line break',
            'landing_path: /',
          ]
          for (const value of required) {
            if (!text.includes(value)) throw new Error(`Missing WhatsApp context: ${value}`)
          }

          if (text.includes('SENSITIVE_TEST_ID') || text.includes('gclid:')) {
            throw new Error('Raw paid click ID leaked into WhatsApp message')
          }
          if (text.includes('sale|line') || text.includes('sale\nline')) {
            throw new Error('Unsafe attribution delimiter reached WhatsApp message')
          }
          NODE

          printf '%s' "$cache_control" | grep -F 'no-store' >/dev/null
          printf '%s' "$robots" | grep -F 'noindex' >/dev/null

      - name: Verify invalid intent fails safe
        shell: bash
        run: |
          set -euo pipefail
          location="$(curl -sS -D - -o /dev/null "$SITE_URL/api/whatsapp?intent=not-a-real-intent" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}')"
          LOCATION="$location" node <<'NODE'
          const destination = new URL(process.env.LOCATION || '')
          const text = destination.searchParams.get('text') || ''
          if (!text.includes('intenção: primary')) throw new Error('Invalid intent did not fall back to primary')
          NODE

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Sales funnel health'
            echo "- Tested source: $SITE_URL"
            echo '- Verifies WhatsApp redirect remains HTTP 302 and non-cacheable.'
            echo '- Verifies lead_ref is generated and matches the WhatsApp context.'
            echo '- Verifies intent, source, channel, campaign and landing attribution survive the redirect.'
            echo '- Verifies raw advertising click IDs do not leak into the seller message.'
            echo '- Verifies untrusted delimiters are sanitized.'
            echo '- Verifies invalid intents fall back safely to primary.'
            echo '- No frontend behavior or layout is added by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
