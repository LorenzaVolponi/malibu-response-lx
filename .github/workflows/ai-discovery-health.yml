name: AI Discovery Health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: malibu-ai-discovery-health
  cancel-in-progress: true

jobs:
  readiness:
    name: Verify production AI and crawler surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      SITE_URL: https://malibu-response-lx.vercel.app

    steps:
      - name: Check canonical and discovery endpoints
        shell: bash
        run: |
          set -euo pipefail

          check_200() {
            local path="$1"
            local code
            code="$(curl -L -sS -o /tmp/body -w '%{http_code}' "$SITE_URL$path")"
            if [ "$code" != "200" ]; then
              echo "Expected 200 for $path, got $code"
              cat /tmp/body || true
              exit 1
            fi
          }

          for path in / /robots.txt /sitemap.xml /sitemap-images.xml /llms.txt /ai.txt /boat.json /citation.json /authority.json /feed.xml /dossie-tecnico /api/ai-readiness; do
            check_200 "$path"
          done

          curl -L -sS "$SITE_URL/" | grep -F 'rel="canonical"' >/dev/null
          curl -L -sS "$SITE_URL/" | grep -F "$SITE_URL" >/dev/null

      - name: Verify HTTP discovery and freshness signals
        shell: bash
        run: |
          set -euo pipefail

          ROOT_HEADERS="$(curl -sSI "$SITE_URL/")"
          printf '%s' "$ROOT_HEADERS" | grep -Fi '/boat.json' >/dev/null
          printf '%s' "$ROOT_HEADERS" | grep -Fi '/citation.json' >/dev/null
          printf '%s' "$ROOT_HEADERS" | grep -Fi '/authority.json' >/dev/null
          printf '%s' "$ROOT_HEADERS" | grep -Fi '/llms.txt' >/dev/null

          for path in /llms.txt /ai.txt /citation.json /authority.json; do
            HEADERS="$(curl -sSI "$SITE_URL$path")"
            printf '%s' "$HEADERS" | grep -Fi 'etag:' >/dev/null
            printf '%s' "$HEADERS" | grep -Fi 'last-modified:' >/dev/null
            printf '%s' "$HEADERS" | grep -Fi 'link:' >/dev/null
          done

          AUTHORITY_ROBOTS="$(curl -sSI "$SITE_URL/authority.json")"
          printf '%s' "$AUTHORITY_ROBOTS" | grep -Fi 'x-robots-tag:' | grep -Fi 'noindex' >/dev/null

      - name: Verify crawler policy
        shell: bash
        run: |
          set -euo pipefail
          ROBOTS="$(curl -L -sS "$SITE_URL/robots.txt")"
          printf '%s' "$ROBOTS" | grep -F 'OAI-SearchBot' >/dev/null
          printf '%s' "$ROBOTS" | grep -F 'OAI-AdsBot' >/dev/null
          printf '%s' "$ROBOTS" | grep -F 'GPTBot' >/dev/null
          printf '%s' "$ROBOTS" | grep -F '/citation.json' >/dev/null
          printf '%s' "$ROBOTS" | grep -F '/authority.json' >/dev/null

          for agent in OAI-SearchBot OAI-AdsBot ChatGPT-User GPTBot; do
            code="$(curl -A "$agent" -L -sS -o /dev/null -w '%{http_code}' "$SITE_URL/")"
            if [ "$code" != "200" ]; then
              echo "$agent cannot fetch production homepage: HTTP $code"
              exit 1
            fi
          done

      - name: Verify machine-readable evidence and authority contracts
        shell: bash
        run: |
          set -euo pipefail

          curl -L -sS "$SITE_URL/api/ai-readiness" > /tmp/readiness.json
          jq -e '.status == "ok"' /tmp/readiness.json >/dev/null
          jq -e --arg site "$SITE_URL" '.canonicalUrl == $site' /tmp/readiness.json >/dev/null
          jq -e '.evidencePolicy.validationRequired | length >= 4' /tmp/readiness.json >/dev/null
          jq -e '.discoverySurfaces.authorityManifest | length > 10' /tmp/readiness.json >/dev/null

          curl -L -sS "$SITE_URL/boat.json" > /tmp/boat.json
          jq -e --arg site "$SITE_URL" '.canonicalUrl == $site' /tmp/boat.json >/dev/null
          jq -e '.authenticity.pendingIndependentValidation | length >= 4' /tmp/boat.json >/dev/null
          jq -e '.machineGuidance.citationInstruction | length > 20' /tmp/boat.json >/dev/null

          curl -L -sS "$SITE_URL/citation.json" > /tmp/citation.json
          jq -e --arg site "$SITE_URL" '.canonical == $site' /tmp/citation.json >/dev/null
          jq -e '.publishedClaims | length >= 8' /tmp/citation.json >/dev/null
          jq -e '.pendingIndependentValidation | length >= 4' /tmp/citation.json >/dev/null
          jq -e '.citationBoundary | length > 40' /tmp/citation.json >/dev/null
          jq -e '.preferredSourceLinks | index("'"$SITE_URL"'/authority.json") != null' /tmp/citation.json >/dev/null

          curl -L -sS "$SITE_URL/authority.json" > /tmp/authority.json
          jq -e --arg site "$SITE_URL" '.canonical == $site' /tmp/authority.json >/dev/null
          jq -e '.queryPortfolio.ptBR | length >= 6' /tmp/authority.json >/dev/null
          jq -e '.semanticClusters.transactional | length >= 3' /tmp/authority.json >/dev/null
          jq -e '.salesMeasurement.channelGroups | index("organic_search") != null' /tmp/authority.json >/dev/null
          jq -e '.salesMeasurement.channelGroups | index("ai_referral") != null' /tmp/authority.json >/dev/null
          jq -e '.boundaries | length >= 4' /tmp/authority.json >/dev/null

      - name: Publish health summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Malibu AI and organic authority backend'
            echo "- Canonical: $SITE_URL"
            echo '- Checked: robots, sitemaps, llms.txt, ai.txt, boat.json, citation.json, authority.json, RSS and technical dossier'
            echo '- Checked crawler access: OAI-SearchBot, OAI-AdsBot, ChatGPT-User and GPTBot'
            echo '- Checked freshness: ETag, Last-Modified and HTTP discovery links'
            echo '- Checked evidence contract: published facts stay separate from pending validation'
            echo '- Checked authority contract: query portfolio, semantic clusters and acquisition-channel boundaries'
            echo '- This workflow changes no frontend behavior.'
          } >> "$GITHUB_STEP_SUMMARY"
