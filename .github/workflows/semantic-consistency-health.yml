name: Semantic Consistency Health

on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: read

jobs:
  verify:
    name: Verify production search and AI facts agree
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout policy contract
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify canonical semantic consistency
        env:
          SITE_URL: https://malibu-response-lx.vercel.app
          CANONICAL_URL: https://malibu-response-lx.vercel.app
        run: node scripts/verify-semantic-consistency-runtime.mjs

      - name: Publish semantic health summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Semantic consistency health'
            echo '- Compares the canonical HTML/JSON-LD with boat.json, citation.json, authority.json, llms.txt, ai.txt and sitemap.xml.'
            echo '- Locks the published commercial facts: 2013, R$ 165.000, 940 h, Indmar Monsoon 350 SS V8, 350 HP, Direct Drive and Zero Off GPS.'
            echo '- Verifies that 9 curated guides remain promoted to search and 18 support guides remain noindex/follow and outside the sitemap.'
            echo '- A failure means search engines and AI systems may be receiving contradictory facts or indexation guidance.'
            echo '- This workflow does not change the frontend.'
          } >> "$GITHUB_STEP_SUMMARY"
