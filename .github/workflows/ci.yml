name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Vercel build quota classifier
        run: node scripts/vercel-ignore-build.test.mjs

      - name: Verify Vercel deployment policy
        run: node scripts/vercel-deployment-policy.test.mjs

      - name: Verify search index policy coverage
        run: node scripts/verify-search-index-policy.mjs

      - name: Resolve latest runtime release
        run: node scripts/check-production-runtime-freshness.mjs --expected-only

      - name: Verify runtime ancestry contract
        run: node scripts/runtime-release.test.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify search policy and semantic consistency at runtime
        shell: bash
        run: |
          set -euo pipefail
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/malibu-ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              SITE_URL=http://127.0.0.1:3000 node scripts/verify-guide-index-runtime.mjs
              SITE_URL=http://127.0.0.1:3000 CANONICAL_URL=https://malibu-response-lx.vercel.app node scripts/verify-semantic-consistency-runtime.mjs
              exit 0
            fi
            sleep 1
          done

          cat /tmp/malibu-ci-server.log || true
          exit 1
