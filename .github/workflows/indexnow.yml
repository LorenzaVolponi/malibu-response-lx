name: IndexNow

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/submit-indexnow.mjs'
      - 'scripts/check-production-runtime-freshness.mjs'
      - 'scripts/vercel-ignore-build.mjs'
      - '.github/workflows/indexnow.yml'
      - 'next.config.mjs'
      - 'vercel.json'
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: true

jobs:
  notify:
    name: Notify search engines
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout full main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for production runtime and submit IndexNow
        env:
          INDEXNOW_SITE_URL: https://malibu-response-lx.vercel.app
          INDEXNOW_KEY: 9a7f3c1e4b8d2f6a0c5e7b1d3f9a4c2e
        run: node scripts/submit-indexnow.mjs

      - name: Publish distribution summary
        if: always()
        shell: bash
        run: |
          {
            echo '### IndexNow distribution'
            echo '- Pushes to main trigger immediate distribution checks for runtime/discovery changes.'
            echo '- Scheduled runs retry the latest runtime release every 6 hours.'
            echo '- Readiness is based on the latest runtime-impacting main release, not literal HEAD equality.'
            echo '- A newer production descendant is accepted when it provably contains the expected runtime release.'
            echo '- Submission is deferred rather than sending stale URLs when production is genuinely behind.'
            echo '- Machine-only manifests remain excluded because IndexNow receives only indexable HTML URLs from sitemap.xml.'
          } >> "$GITHUB_STEP_SUMMARY"
