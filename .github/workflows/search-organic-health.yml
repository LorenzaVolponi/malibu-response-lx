name: Search Organic Health

on:
  workflow_dispatch:
  schedule:
    - cron: '53 9 * * *'

permissions:
  contents: read

concurrency:
  group: malibu-search-organic-health
  cancel-in-progress: true

jobs:
  search:
    name: Verify Google and Bing indexability
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      SITE_URL: https://malibu-response-lx.vercel.app

    steps:
      - name: Verify core pages are indexable
        shell: bash
        run: |
          set -euo pipefail

          for path in / /comprar-barco-malibu-response-lx /dossie-tecnico /guias; do
            code="$(curl -L -sS -o /tmp/page -w '%{http_code}' "$SITE_URL$path")"
            if [ "$code" != "200" ]; then
              echo "Expected 200 for $path, got $code"
              exit 1
            fi

            headers="$(curl -sSI "$SITE_URL$path")"
            if printf '%s' "$headers" | grep -Eqi '^x-robots-tag:.*noindex'; then
              echo "Unexpected noindex header on $path"
              exit 1
            fi
          done

      - name: Verify canonical authority
        shell: bash
        run: |
          set -euo pipefail

          check_canonical() {
            local path="$1"
            local expected="$2"
            local html
            html="$(curl -L -sS "$SITE_URL$path")"
            printf '%s' "$html" | grep -F 'rel="canonical"' >/dev/null
            printf '%s' "$html" | grep -F "$expected" >/dev/null
          }

          check_canonical / "$SITE_URL"
          check_canonical /comprar-barco-malibu-response-lx "$SITE_URL/comprar-barco-malibu-response-lx"
          check_canonical /dossie-tecnico "$SITE_URL/dossie-tecnico"

      - name: Verify Google and Bing crawler access
        shell: bash
        run: |
          set -euo pipefail
          ROBOTS="$(curl -L -sS "$SITE_URL/robots.txt")"
          printf '%s' "$ROBOTS" | grep -F 'Googlebot' >/dev/null
          printf '%s' "$ROBOTS" | grep -F 'Bingbot' >/dev/null

          for agent in Googlebot Bingbot; do
            for path in / /comprar-barco-malibu-response-lx /dossie-tecnico; do
              code="$(curl -A "$agent" -L -sS -o /dev/null -w '%{http_code}' "$SITE_URL$path")"
              if [ "$code" != "200" ]; then
                echo "$agent cannot fetch $path: HTTP $code"
                exit 1
              fi
            done
          done

      - name: Verify sitemap coverage
        shell: bash
        run: |
          set -euo pipefail
          SITEMAP="$(curl -L -sS "$SITE_URL/sitemap.xml")"
          printf '%s' "$SITEMAP" | grep -F "<loc>$SITE_URL</loc>" >/dev/null
          printf '%s' "$SITEMAP" | grep -F "$SITE_URL/comprar-barco-malibu-response-lx" >/dev/null
          printf '%s' "$SITEMAP" | grep -F "$SITE_URL/dossie-tecnico" >/dev/null
          printf '%s' "$SITEMAP" | grep -F "$SITE_URL/guias" >/dev/null

          IMAGE_SITEMAP="$(curl -L -sS "$SITE_URL/sitemap-images.xml")"
          printf '%s' "$IMAGE_SITEMAP" | grep -F "$SITE_URL/images/" >/dev/null

      - name: Verify commercial structured data
        shell: bash
        run: |
          set -euo pipefail
          HTML="$(curl -L -sS "$SITE_URL/")"
          printf '%s' "$HTML" | grep -F '"@type":"Product"' >/dev/null
          printf '%s' "$HTML" | grep -F '"@type":"Offer"' >/dev/null
          printf '%s' "$HTML" | grep -F '"priceCurrency":"BRL"' >/dev/null
          printf '%s' "$HTML" | grep -F '"price":165000' >/dev/null
          printf '%s' "$HTML" | grep -F 'Malibu Response LX' >/dev/null

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Search organic health'
            echo '- Checked indexability of core transactional/technical pages.'
            echo '- Checked canonical URLs.'
            echo '- Checked Googlebot and Bingbot access.'
            echo '- Checked XML and image sitemap coverage.'
            echo '- Checked Product + Offer commercial structured data.'
            echo '- This workflow changes no frontend behavior.'
          } >> "$GITHUB_STEP_SUMMARY"
